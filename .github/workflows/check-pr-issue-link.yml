name: Check PR Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:
    # No inputs needed — the workflow uses the caller's github.token and context.repo automatically.
    # Callers must declare these permissions in their own workflow:
    #   permissions:
    #     pull-requests: write
    #     issues: write
    #
    # This workflow is only callable by repositories in the StacklokLabs organization.
    # Prerequisite: enable "Accessible from repositories in the 'StacklokLabs' organization"
    # in this repo under Settings → Actions → General → Access.

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-issue-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SENTINEL = '<!-- pr-issue-check-warning -->';
            const LABEL = 'needs-issue-link';
            const LINK_REGEX = /\b(closes|fixes|resolves|close|fix|resolve)\s+(?:([\w.-]+)\/([\w.-]+)#|#?)(\d+)\b/gi;

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            async function ensureLabelExists() {
              try {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: LABEL,
                  color: 'e4e669',
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function findExistingWarningComment() {
              for await (const { data: comments } of github.paginate.iterator(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              )) {
                const found = comments.find(c => c.body.includes(SENTINEL));
                if (found) return found;
              }
              return null;
            }

            async function upsertComment(body) {
              const existing = await findExistingWarningComment();
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: prNumber,
                  body,
                });
              }
            }

            async function deleteWarningComment() {
              const existing = await findExistingWarningComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner, repo,
                  comment_id: existing.id,
                });
              }
            }

            async function addWarningLabel() {
              try {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: prNumber,
                  labels: [LABEL],
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function removeWarningLabel() {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: prNumber,
                  name: LABEL,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            await ensureLabelExists();

            const body = context.payload.pull_request.body || '';
            const matches = [...body.matchAll(LINK_REGEX)];

            // Build unique references keyed by owner/repo#num so same-repo #N
            // and cross-repo owner/repo#N are not collapsed.
            const refsByKey = new Map();
            for (const m of matches) {
              const refOwner = m[2] || owner;
              const refRepo = m[3] || repo;
              const number = parseInt(m[4], 10);
              const isCrossRepo = Boolean(m[2] && m[3]);
              const key = `${refOwner}/${refRepo}#${number}`;
              if (!refsByKey.has(key)) {
                refsByKey.set(key, { owner: refOwner, repo: refRepo, number, isCrossRepo });
              }
            }
            const references = [...refsByKey.values()];

            if (references.length === 0) {
              await upsertComment(
                `${SENTINEL}\n## Missing Issue Link\n\nThis PR does not appear to reference a GitHub issue.\nPlease add a closing keyword, e.g. \`Closes #123\` or \`Closes owner/repo#123\`.\nSupported: closes, fixes, resolves, close, fix, resolve (case insensitive)`
              );
              await addWarningLabel();
              core.warning('PR has no linked issue');
              return;
            }

            // Render a reference as it should appear in user-facing messages:
            // same-repo → `#123`, cross-repo → `owner/repo#123`.
            function renderRef(ref) {
              return ref.isCrossRepo ? `${ref.owner}/${ref.repo}#${ref.number}` : `#${ref.number}`;
            }

            const notFoundRefs = [];
            const pullRequestRefs = [];
            const validRefs = [];

            for (const ref of references) {
              try {
                const { data } = await github.rest.issues.get({
                  owner: ref.owner,
                  repo: ref.repo,
                  issue_number: ref.number,
                });

                // Pull requests are also returned by the issues API; filter them out as invalid issues.
                if (data.pull_request) {
                  pullRequestRefs.push(ref);
                } else {
                  validRefs.push(ref);
                }
              } catch (e) {
                if (e.status === 404) {
                  // A 404 on a cross-repo ref (typo, private repo, or repo the
                  // token cannot access) is treated the same as a same-repo 404.
                  notFoundRefs.push(ref);
                } else {
                  throw e;
                }
              }
            }

            function notFoundLine(ref) {
              return ref.isCrossRepo
                ? `- \`${renderRef(ref)}\` could not be found`
                : `- \`${renderRef(ref)}\` does not exist in this repository`;
            }

            function pullRequestLine(ref) {
              return `- \`${renderRef(ref)}\` is a pull request, not an issue`;
            }

            const invalidLines = [
              ...notFoundRefs.map(notFoundLine),
              ...pullRequestRefs.map(pullRequestLine),
            ];

            const notFoundSummary = notFoundRefs.map(renderRef).join(', ') || 'none';
            const pullRequestSummary = pullRequestRefs.map(renderRef).join(', ') || 'none';

            if (validRefs.length === 0 && invalidLines.length > 0) {
              await upsertComment(
                `${SENTINEL}\n## Invalid Issue Reference\n\n${invalidLines.join('\n')}\n\nPlease update the PR description to reference a valid issue.`
              );
              await addWarningLabel();
              core.warning(`PR has no valid issue links (not found: ${notFoundSummary}, pull requests: ${pullRequestSummary})`);
            } else if (invalidLines.length > 0) {
              await upsertComment(
                `${SENTINEL}\n## Heads-up: Some Issue References Are Invalid\n\nThe following referenced issues could not be validated:\n${invalidLines.join('\n')}\n\nThe PR has at least one valid issue link, so no action is required — but you may want to clean up the invalid references.`
              );
              await removeWarningLabel();
              core.warning(`PR references non-issues (not found: ${notFoundSummary}, pull requests: ${pullRequestSummary})`);
            } else {
              await deleteWarningComment();
              await removeWarningLabel();
              core.info('PR issue link is valid');
            }
